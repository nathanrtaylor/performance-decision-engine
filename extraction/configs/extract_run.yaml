# ============================================================
# Coaching Decision Engine — Extraction Run Spec
# ============================================================

run:
  run_id: "2026-08-27_weekly_wk6"
  compiled_sql_dir: "extraction/compiled_sql"
  output_dir: "data/raw/weekly"
  flatten_sql: true
  strip_trailing_semicolon: true

globals:
  source_schema: "hive.care"

  start_date: "2026-07-18"
  end_date:   "2026-08-28"
  grain: "week"

  # Always define optional flags globally to avoid StrictUndefined failures
  use_pay_calendar: false

  # Single source of truth for the cohort roster: the engine's active.yaml. Resolved at
  # compile/run time by apply_icp_clients_from_active (extraction/scripts/common.py) into
  # globals.icp_clients, which the SQL templates filter on. To onboard a client, edit ONLY
  # configs/active.yaml icp_clients. (An explicit icp_clients: list here still overrides, e.g. tests.)
  icp_clients_from: configs/active.yaml

outputs:
  agent_metrics:
    sql_file: "extraction/sql/agent_metrics.sql.j2"
    output_file: "agent_metrics.csv"
    require_rows: true
    expected_columns:
      - agent_id
      - period
      - metric
      - icp_client
      - client
      - subclient
      - site
      - numerator
      - denominator
      - calc
    params:
      source_table: "expert_performance_metrics"
      # Populated at compile/run time from metric_catalog (source: agent_metrics).
      metrics_from_catalog: configs/mappings/metric_catalog.yaml

      # keep overrides here only if you ever turn it on
      # calendar_schema: "hive.care"
      # calendar_table: "dim_pay_calendar"

  agents:
    sql_file: "extraction/sql/agents.sql.j2"
    output_file: "agents.csv"
    require_rows: true
    expected_columns:
      - week_ending
      - agent_id
      - mascot
      - icp_client
      - client
      - subclient
      - tenure_group
      - coach
      - coach_id
    params:
      source_table: "expert_performance_metrics"    

  behavior_scores:
    sql_file: "extraction/sql/behavior_scores.sql.j2"
    output_file: "behavior_scores.csv"
    require_rows: true
    expected_columns:
      - agent_id
      - period
      - call_type
      - scorecard_name
      - behavior
      - numerator
      - denominator
      - calc
    params:
      epm_table: "expert_performance_metrics"
      observe_table: "l3_asurion_observe_autoqa_evaluations"

      # governed list of scorecards (template_questions_name). Advanced Discovery Call Flow V1 is
      # extracted separately (extraction/sql/advanced_discovery.sql.j2) under the present-count model;
      # it does NOT belong here (score/opportunity is the right model for these three).
      observe_scorecards:
        - "HEROES Auto Scorecard"
        - "HEROES Auto QA Reporting - VZW"
        - "Customer Sentiment Scorecard V1"

  # Advanced Discovery Call Flow V1 -- its own source/query. All 12 AD behaviors populate the
  # `response_recommendation_advancedevidences_operator` status, so pass-rate = # calls where the
  # behavior was Is_Present / distinct calls the scorecard ran (COUNT DISTINCT meeting_id). The
  # HEROES/sentiment scorecards do NOT populate that operator uniformly, so they stay on the
  # score/opportunity ratio in behavior_scores above. Emits the same shape as behavior_scores.
  advanced_discovery:
    sql_file: "extraction/sql/advanced_discovery.sql.j2"
    output_file: "advanced_discovery.csv"
    require_rows: true
    expected_columns:
      - agent_id
      - period
      - call_type
      - scorecard_name
      - behavior
      - numerator
      - denominator
      - calc
    params:
      epm_table: "expert_performance_metrics"
      observe_table: "l3_asurion_observe_autoqa_evaluations"
      ad_scorecard: "Advanced Discovery Call Flow V1"

      # numerator = # calls where this status column reads present_value; denominator = distinct
      # calls the scorecard ran (COUNT DISTINCT meeting_id). Parameterized so the exact column/value
      # can be tuned without touching the SQL.
      presence_col: "response_recommendation_advancedevidences_operator"
      present_value: "Is_Present"

  # Coaching history feeds recency dampening (soft-suppress recently-coached topics).
  coaching_history:
    sql_file: "extraction/sql/coaching_history.sql.j2"
    output_file: "coaching_history.csv"
    require_rows: false          # tolerate weeks with no logged coaching
    expected_columns:
      - agent_id
      - coaching_date
      - period
      - coaching_status
      - coaching_type
      - coaching_topic
      - behavior
      - behavior_selected
      - expert_acknowledged
    params:
      coaching_table: "l2_asurion_coachdb_coachdb_helixcoaching"
      # events that count as "coached" for dampening (locked decision)
      coaching_status_in:
        - "Submitted"
        - "Excused"
