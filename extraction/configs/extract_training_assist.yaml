# ============================================================
# Ad-hoc extract: TRAINING sources (TrAIning Assist + CBT)
# ============================================================
# Runs the training outputs, isolated from the weekly snapshot.
#
# output_dir is data/raw/adhoc (NOT data/raw/weekly), so run_extract's
# update_latest_pointer() rewrites data/raw/adhoc/latest and leaves the real
# weekly snapshot (data/raw/weekly/latest) untouched.
#
#   python extraction/scripts/run_extract.py --config extraction/configs/extract_training_assist.yaml
#   python -m pde.cli.build_training_assist_skills --raw-dir data/raw/adhoc/latest
#   # (training_cbt.csv is already tall-skinny at DAY grain -- no rollup step needed)
#
# Edit start_date / end_date to the window you want (cover the class start dates in the
# roster). Both outputs are DAY-grained: training_assist `period` = session day,
# training_cbt `period` = completion day. The globals `grain` flag below is used only by
# the weekly coaching extracts, not by these training templates.

run:
  run_id: "adhoc_training_assist"
  compiled_sql_dir: "extraction/compiled_sql"
  output_dir: "data/raw/adhoc"          # isolated from data/raw/weekly/latest
  flatten_sql: true
  strip_trailing_semicolon: true

globals:
  source_schema: "hive.care"
  start_date: "2026-08-22"
  end_date:   "2026-09-11"
  grain: "week"
  use_pay_calendar: false

outputs:
  training_assist:
    sql_file: "extraction/sql/training_assist.sql.j2"
    output_file: "training_assist.csv"
    require_rows: false
    expected_columns:
      - agent_id
      - period
      - call_type
      - scorecard_name
      - behavior
      - attempts
      - numerator
      - denominator
      - calc
    params:
      training_table: "l1_asurion_dst_ai_assisted_training"

  # Session-grain companion to training_assist: the simulator's own Pass/Fail verdict
  # (EvaluationDetails.Results) + native present/total counts, one row per sim attempt.
  # run_training_pipeline rolls this up (best/any-pass) to the per-sim pass/fail verdict;
  # training_assist.csv above stays the per-behavior skill-evidence source.
  training_assist_sessions:
    sql_file: "extraction/sql/training_assist_sessions.sql.j2"
    output_file: "training_assist_sessions.csv"
    require_rows: false
    expected_columns:
      - session_id
      - agent_id
      - session_start_time
      - period
      - call_type
      - scorecard_name
      - evaluation_results
      - present_behaviors
      - max_behaviors
    params:
      training_table: "l1_asurion_dst_ai_assisted_training"

  # Per-session, per-behavior grain: keeps session_id + session_start_time so the pipeline can
  # score a skill from the expert's LATEST attempt of a sim (block-discrete skill scoring).
  # Companion to training_assist.csv (day grain) -- does not replace it.
  training_assist_behaviors:
    sql_file: "extraction/sql/training_assist_behaviors.sql.j2"
    output_file: "training_assist_behaviors.csv"
    require_rows: false
    expected_columns:
      - session_id
      - agent_id
      - session_start_time
      - period
      - call_type
      - scorecard_name
      - behavior
      - behavior_present
    params:
      training_table: "l1_asurion_dst_ai_assisted_training"

  training_cbt:
    sql_file: "extraction/sql/training_cbt.sql.j2"
    output_file: "training_cbt.csv"
    require_rows: false
    expected_columns:
      - agent_id
      - period
      - call_type
      - courseid
      - coursename
      - attempts
      - numerator
      - denominator
      - calc
    params:
      cbt_table: "l1_asurion_flatfile_dbo_workday_learning_course_enrollment"

  # Prior coaching history for the trainees (reuses the UNBOUNDED coaching_history template
  # as-is). It returns every coached agent in the window; the training dashboard queries it
  # for only the class-roster cohort. Landed here so a training extract run drops
  # coaching_history.csv into data/raw/adhoc/latest alongside the training sources.
  # (Duplicates the weekly coaching extract if both run -- accepted.) Uses source_schema +
  # grain from globals; start_date/end_date are widened below (prior coaching precedes the
  # class window). Edit the window as needed.
  coaching_history:
    sql_file: "extraction/sql/coaching_history.sql.j2"
    output_file: "coaching_history.csv"
    require_rows: false
    expected_columns:
      - agent_id
      - coaching_date
      - period
      - coaching_status
      - coaching_type
      - coaching_topic
      - behavior
      - behavior_selected
      - expert_acknowledged
    params:
      coaching_table: "l2_asurion_coachdb_coachdb_helixcoaching"
      coaching_status_in:
        - "Submitted"
        - "Excused"
      
