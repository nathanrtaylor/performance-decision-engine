# ============================================================
# Ad-hoc extract: TRAINING sources (TrAIning Assist + CBT)
# ============================================================
# Runs the training outputs, isolated from the weekly snapshot.
#
# output_dir is data/raw/adhoc (NOT data/raw/weekly), so run_extract's
# update_latest_pointer() rewrites data/raw/adhoc/latest and leaves the real
# weekly snapshot (data/raw/weekly/latest) untouched.
#
#   python extraction/scripts/run_extract.py --config extraction/configs/extract_training_assist.yaml
#   python -m cde.cli.build_training_assist_skills --raw-dir data/raw/adhoc/latest
#   # (training_cbt.csv is already tall-skinny at DAY grain -- no rollup step needed)
#
# Edit start_date / end_date to the window you want (cover the class start dates in the
# roster). Both outputs are DAY-grained: training_assist `period` = session day,
# training_cbt `period` = completion day. The globals `grain` flag below is used only by
# the weekly coaching extracts, not by these training templates.

run:
  run_id: "adhoc_training_assist"
  compiled_sql_dir: "extraction/compiled_sql"
  output_dir: "data/raw/adhoc"          # isolated from data/raw/weekly/latest
  flatten_sql: true
  strip_trailing_semicolon: true

globals:
  source_schema: "hive.care"
  start_date: "2026-08-22"
  end_date:   "2026-09-04"
  grain: "week"
  use_pay_calendar: false

outputs:
  training_assist:
    sql_file: "extraction/sql/training_assist.sql.j2"
    output_file: "training_assist.csv"
    require_rows: false
    expected_columns:
      - agent_id
      - period
      - call_type
      - scorecard_name
      - behavior
      - attempts
      - numerator
      - denominator
      - calc
    params:
      training_table: "l1_asurion_dst_ai_assisted_training"

  training_cbt:
    sql_file: "extraction/sql/training_cbt.sql.j2"
    output_file: "training_cbt.csv"
    require_rows: false
    expected_columns:
      - agent_id
      - period
      - call_type
      - courseid
      - coursename
      - attempts
      - numerator
      - denominator
      - calc
    params:
      cbt_table: "l1_asurion_flatfile_dbo_workday_learning_course_enrollment"
