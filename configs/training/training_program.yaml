# configs/training/training_program.yaml
# ============================================================================
# ASCEND "Launchpad" program structure  --  SEED (for SME review & completion)
# ============================================================================
# Seeded from docs/training/"Ascend Learning Blocks Training Strategy.docx"
# (16 learning blocks, ~45 CBTs, ~189 simulations). This is the routing table
# Phase 3's remediation engine consumes: block sequence + gates + which skills
# each component develops (deficient skill -> components to retake).
#
# PARTIAL BY DESIGN. Fill in incrementally; the coverage checker reports what is
# still TODO (unmapped skills, components without refs, blocks missing a gate).
#
# What is seeded vs TODO:
#   - blocks / order / labels / estimated_hours / expected_completion_day : from the doc.
#   - assessment_methods, total_simulations : from the doc.
#   - gate.pass_mark : seeded from each block's "Minimum Performance Expectations"
#       (mostly 9-of-10 = 0.90; some 100% = 1.0). gate.test_call ref = TODO
#       (map to the block's TrAIning Assist end-of-block test-call challenge_id).
#   - develops : BEST-EFFORT seed where the block maps cleanly to the 22 cataloged
#       TrAIning Assist skills; [] # TODO where it does not (tools/troubleshooting
#       blocks have no direct sim-skill yet). SME to confirm.
#   - components (individual CBTs/sims by ref) : TODO -- enumerate from the course
#       tables + "Ascend Simulations.xlsx" and reconcile CBT courseids once the
#       training_cbt extract lands.
#
# NOTE on expected_completion_day: PROVISIONAL. Derived as cumulative
# estimated_hours / pace.hours_per_day (content+sim time only -- excludes ILT,
# coaching, remediation, breaks). Replace with the real class calendar.

program:
  name: "ASCEND Launchpad"
  source: 'docs/training/Ascend Learning Blocks Training Strategy.docx'
  totals: { learning_blocks: 16, cbts: 45, videos: 23, simulations: 189, ilt: 1 }

  # Pacing assumption used to derive expected_completion_day from cumulative hours.
  pace:
    hours_per_day: 6          # productive content/sim hours per training day (ADJUST to real schedule)

  defaults:
    gate_pass_mark: 0.90      # "9 of 10 evaluated scenarios" is the common bar; some blocks require 1.0

  blocks:
    - id: block_01
      order: 1
      label: "Welcome to Asurion"
      estimated_hours: 4.5
      expected_completion_day: 1        # cum 4.5h
      assessment_methods: [knowledge_check]
      gate: { test_call: TODO, pass_mark: 0.90 }
      develops: []                      # orientation; no demonstrated sim skill

    - id: block_02
      order: 2
      label: "Expert Foundations - The Tech Coach Role & Call Flow"
      estimated_hours: 2.0
      expected_completion_day: 2        # cum 6.5h
      total_simulations: 13
      assessment_methods: [knowledge_check, simulation, training_assist]
      gate: { test_call: TODO, pass_mark: 0.90 }
      develops: [set_expectations, transition_statement]   # SEED - call-flow structure

    - id: block_03
      order: 3
      label: "Tools for the Call Flow - Asurion Tools"
      estimated_hours: 3.0
      expected_completion_day: 2        # cum 9.5h
      total_simulations: 10
      assessment_methods: [knowledge_check, simulation, training_assist, assima, helix_search]
      gate: { test_call: TODO, pass_mark: 0.90 }
      develops: []                      # TODO - tool-proficiency skills not in the sim-skill catalog

