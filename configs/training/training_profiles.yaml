# ============================================================================
# TrAIning Assist — Skill mapping & simulator profiles
# (configs/training/training_profiles.yaml)
# ============================================================================
# Source of truth for the TrAIning Assist SIMULATOR
# (source table: hive.care.l1_asurion_dst_ai_assisted_training). Two jobs:
#   1. skills:   behavior -> SKILL mapping — the ~22 skills that become metrics in
#                mappings/metric_catalog.yaml and topics in mappings/topic_map.yaml.
#   2. profiles: per-simulator-persona (challenge_id) skill requirements — which
#                skills each scenario evaluates. Consumed by
#                src/pde/ingestion/training_assist_skills.py to roll raw behaviors
#                up to skill-level pass-rates.
#
# CONNECTION TO training_program.yaml (the learning-block routing table):
#   • SKILLS are the join key: each block's `develops:` lists skill ids defined
#     here; metric_catalog catalogs the same ids.
#   • PROFILES are sim COMPONENTS: a challenge_id here is what a program block's
#     `components: {kind: skill_sim, ref: <challenge_id>}` points at.
#   Edit skills/profiles HERE; edit block sequence/gates in training_program.yaml.
# ============================================================================

# ---------------------------------------------------------------------------
# Meta
# ---------------------------------------------------------------------------
version: 1
description: Semantic mapping for TrAIning Assist profile scenarios and skill-development reporting.

# ---------------------------------------------------------------------------
# Defaults — global scoring assumptions
# ---------------------------------------------------------------------------
defaults:
  unspecified_requirement: never
  score_grain: agent_id x week_ending x challenge_id x behavior
  attempts_definition: count distinct session_id before session_id is dropped from final reporting output

# ---------------------------------------------------------------------------
# Requirement rules — which requirement levels count toward scoring
# (include_in_scoring); mirrored by build_training_assist_skills.
# ---------------------------------------------------------------------------
requirement_rules:
  always:
    include_in_scoring: true
    requires_opportunity: false
  conditional:
    include_in_scoring: true
    requires_opportunity: true
    source_value: Only if Yes
  as_needed:
    include_in_scoring: true
    requires_opportunity: true
    source_value: As needed
  never:
    include_in_scoring: false
    requires_opportunity: false

# ---------------------------------------------------------------------------
# Skill catalog — categories (call-flow order)
# ---------------------------------------------------------------------------
skill_categories:
  customer_connection:
    label: Customer Connection
  call_control:
    label: Call Control
  discovery:
    label: Technical Discovery
  resolution:
    label: Resolution
  sales_transition:
    label: Sales Transition
  sales_discovery:
    label: Sales Discovery
  value_presentation:
    label: Value Presentation
  sales_delivery:
    label: Sales Delivery
  closing:
    label: Closing
  objection_handling:
    label: Objection Handling
  compliance:
    label: Compliance
  call_close:
    label: Call Close

# ---------------------------------------------------------------------------
# Skill catalog — behavior -> skill mapping, grouped by category.
# mapping_status: mapped | mapped_alias | review_required | unmapped.
# Each skill id is referenced by profiles (below), metric_catalog, and
# training_program.yaml `develops:`.
# ---------------------------------------------------------------------------
