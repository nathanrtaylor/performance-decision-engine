# ---------------------------------------------------------------------------
# Simulator profiles — one per challenge_id (the persona an expert practices
# against). `requirements` lists the skills each scenario evaluates, by level.
# challenge_id is the ref a training_program.yaml skill_sim component points at.
# Grouped by client / line-of-business; within a group: Live, then Testing/On hold.
#
# Naming invariant: challenge_id == _snake(source_profile_name) for every profile
# (lowercase, non-alphanumeric runs -> "_"; the same transform tools/gen_program_components.py
# applies to the xlsx `Name` column). So the human name and the slug are one fact in two forms.
#
# Optional `sim_id`: the ASC-SIM-… ref for the ASCEND sim whose `Name` (in
# docs/training/Ascend Simulations.xlsx) equals this profile's source_profile_name. It mirrors
# the matching training_program.yaml component -- challenge_id == component.persona and
# sim_id == component.ref -- making the profile<->program link explicit in data.
# check_training_program.py enforces that pairing. No code reads sim_id at runtime yet (data-only;
# a stable anchor for tooling/validation). Absent until that sim exists in the workbook / goes
# live in TA under this persona -- today only the 3 block_03 personas below qualify; the rest
# fill in as ASCEND sims launch.
# ---------------------------------------------------------------------------
