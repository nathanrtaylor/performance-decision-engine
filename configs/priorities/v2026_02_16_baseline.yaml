priorities:
  version: v2026_02_16_baseline

  # Default weighting stance: business metrics dominate
  by_category:
    sell: 1.0
    serve: 0.8
    solve: 0.9
    business: 0.9
    tool_usage: 0.8
    quality_behavior: 0.7

  # Optional: explicit overrides (leave empty if you’re not ready)
  by_metric: {}

  # Optional: call type overrides (not used if call_type_mode is disabled)
  by_call_type: {}

  # Deterministic tie-break preferences (optional)
  tie_breakers:
    prefer_categories_in_order: [sell, serve, solve, business, tool_usage, quality_behavior]
