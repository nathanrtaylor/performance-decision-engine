# configs/active.yaml
# Single pointer file that selects the current governed configuration set.
# This should be the only config file ops/engineering “flip” to change behavior quickly.

# ---------------------------------------------------
# Mapping Layer (Structural + Semantic)
# ---------------------------------------------------

mappings:
  source_catalog: mappings/source_catalog.yaml
  metric_catalog: mappings/metric_catalog.yaml
  topic_map: mappings/topic_map.yaml
  benchmarks: mappings/benchmarks.yaml
  coaching_history_map: mappings/coaching_history_map.yaml
  themes: mappings/themes.yaml   # human-curated coaching themes (auto-loads to cfg["themes"])

# ---------------------------------------------------
# Signal Gating
# ---------------------------------------------------

thresholds: thresholds/signal_thresholds.yaml

# ---------------------------------------------------
# Business Priorities (Versioned)
# ---------------------------------------------------

priorities: priorities/v2026_02_16_baseline.yaml

# ---------------------------------------------------
# Data Snapshot Configuration
# ---------------------------------------------------

data_snapshot:
  mode: latest          # explicit | latest  (latest reads <root>/latest; snapshot_id used only for explicit)
  root: data/raw/weekly
  snapshot_id: 2026-06-18_weekly_wk8   # used only when mode: explicit
  expected_sources:     # required tables; coaching_history is intentionally NOT here (optional input)
    - agents
    - agent_metrics
    - behavior_scores
    #- expert_assist
    #- smart_offer

# ---------------------------------------------------
# Call Type Behavior
# ---------------------------------------------------

call_type_mode: disabled
default_call_type: "all"

# ---------------------------------------------------
# Scoring Model Controls
# ---------------------------------------------------

priority_model:
  w_level: 0.5
  w_trend: 0.2
  w_risk: 0.3
  w_confidence: 0.0

risk_model:
  alpha_level: 0.7
  beta_trend: 0.3

signal_window:
  volatility_periods: 4

# ---------------------------------------------------
# Eligibility & Dampening
# ---------------------------------------------------

eligibility:
  min_confidence: 0.55

dampening:
  mode: multiply        # multiply | suppress. multiply keeps recently-coached topics in
  periods: 2            # contention at reduced weight so a severe gap can still win.
  multiplier: 0.5

# ---------------------------------------------------
# Theme Layer (selection above single-metric coaching)
# ---------------------------------------------------
# Tier 2: a theme (configs/mappings/themes.yaml) is delivered when a coherent
# group of behaviors is deficient together; otherwise the engine falls back to
# the single best behavior (Tier 3, unchanged). With no themes.yaml configured
# this block is inert and behavior is identical to the pre-theme engine.
theme_selection:
  count_fraction: 0.5     # >= this fraction of a theme's members must be deficient to qualify
  score_level_floor: 0.15 # single low global floor for "deficient" (looser than the solo bar)
  aggregate: mean         # mean | sum: how member score_total combine into the theme score

# Tier 1: break-glass override. Only metrics carrying a per-metric break_glass
# block in metric_catalog.yaml are eligible. Over the latest `recency_weeks`
# weeks, an agent in the worst `worst_pct`% of its ICP_Client x metric cohort
# AND below benchmark overrides any theme. Defaults here apply when a metric's
# break_glass block omits a value.
break_glass:
  recency_weeks: 2        # X: latest weeks slice (short recency window, NOT the 8-week window)
  worst_pct: 10           # default P: worst P% of the ICP_Client x metric cohort

# ---------------------------------------------------
# Abstention (no-recommendation floor)
# ---------------------------------------------------
# After selection, a single-behavior recommendation whose priority_score falls below this floor is
# withheld: the agent is performing adequately and gets an explicit, explained NON-recommendation
# (see abstentions.csv + decision_receipts tier="abstained" + the dashboard section). Break-glass and
# theme recommendations are material by construction and are never abstained. min_priority_score is
# provisional; calibrate from the priority_score distribution of a real run.
abstention:
  enabled: true
  min_priority_score: 0.10   # calibrated from the priority_score distribution (abstains the weak bottom ~10% of single recs)

# ---------------------------------------------------
# Explainability
# ---------------------------------------------------

explainability:
  top_competitors: 3

# Tie-breakers (optional: stable preference order when scores are tied)
tie_breakers:
  # topic_order can be omitted; engine will sort lexicographically for final stability
  topic_order:
    - "Reduce Client Transfer Rate"
    - "Improve Resolution Rate"
    - "Reduce Cancel Rate"
    - "Increase Guided Flow Adoption"
    - "Increase Expert Assist Usage"
    - "Improve Smart Offer Adoption"
    - "Strengthen Empathy Statements"
    - "Use Clear Transition Statements"

# Conversation type per topic is defined once, in topic_map.yaml
# (topic_to_conversation_type); topics not listed there fall back to the default
# below. An optional conversation_types.by_topic block may still be added here to
# override the topic map for specific topics, but is intentionally empty because
# every override previously listed was identical to the topic map.
conversation_types:
  default: "Performance Coaching"

# ---------------------------------------------------
# Metadata (Provenance)
# ---------------------------------------------------

meta:
  version: v2026_02_16_baseline
  data_snapshot: auto   # stamped at runtime from the resolved snapshot (see cli/run_pipeline.py)
  engine_version: 0.1.0
