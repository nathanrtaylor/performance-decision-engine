metric_catalog:

  # ---------------------------------------------------
  # Canonical metric definitions (decision contract)
  # Topics are NOT defined here.
  # ---------------------------------------------------

  metrics:

    # =========================
    # BUSINESS METRICS (agent_metrics)
    # =========================

    transfer_rate:
      source: agent_metrics
      source_metric_key: "client transfers"
      category: business
      direction: lower_is_better
      unit: rate
      description: "Transfers / handled calls."
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 20
      benchmark:
        type: config

    resolution_rate:
      source: agent_metrics
      source_metric_key: "resolution rate"
      category: business
      direction: higher_is_better
      unit: rate
      description: "Resolved / eligible calls."
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 30
      benchmark:
        type: config

    one_call_resolution:
      source: agent_metrics
      source_metric_key: "ocr"
      category: business
      direction: higher_is_better
      unit: rate
      description: "Resolved / eligible calls on the first call"
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 30
      benchmark:
        type: config

    hold_time:
      source: agent_metrics
      source_metric_key: "hold time"
      category: business
      direction: lower_is_better
      unit: rate
      description: "time spent on hold / calls"
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: average
        denominator_min: 10
      benchmark:
        type: config

    talk_time:
      source: agent_metrics
      source_metric_key: "talk time"
      category: business
      direction: lower_is_better
      unit: rate
      description: "time spent on talking / calls"
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: average
        denominator_min: 10
      benchmark:
        type: config

    callback_rate:
      source: agent_metrics
      source_metric_key: "callback_rate"
      category: business
      direction: lower_is_better
      unit: rate
      description: "outbound calls to customers / calls"
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 10
      benchmark:
        type: config

    cancel_rate:
      source: agent_metrics
      source_metric_key: "cancellation rate"
      category: business
      direction: lower_is_better
      unit: rate
      description: "sales cancellations after the call"
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 5
      benchmark:
        type: config
      # break_glass: a Tier-1 override metric. Over the latest break_glass.recency_weeks
      # weeks, an agent in the worst `worst_pct`% of its ICP_Client cohort AND below
      # benchmark is coached on this metric directly, overriding any theme. Only metrics
      # carrying this block are override-eligible; recency_weeks inherits active.yaml.
      break_glass:
        enabled: true
        worst_pct: 5

    erp:
      source: agent_metrics
      source_metric_key: "erp"
      category: business
      direction: higher_is_better
      unit: rate
      description: "Entire Rep Performance, survey based scoring"
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 5
      benchmark:
        type: config

    expert_5star:
      source: agent_metrics
      source_metric_key: "expert 5star"
      category: business
      direction: higher_is_better
      unit: rate
      description: "Expert survey based scoring only when 5 stars is received"
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 5
      benchmark:
        type: config

    nsp100:
      source: agent_metrics
      source_metric_key: "nsp100"
      category: business
      direction: higher_is_better
      unit: rate
      description: "Sales, net of cancellation, per 100 calls"
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 5
      benchmark:
        type: config

    crt:
      source: agent_metrics
      source_metric_key: "crt"
      category: business
      direction: lower_is_better
      unit: rate
      description: "Call Resolution time. Measure of call handling time and efficiency"
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: average
        denominator_min: 5
      benchmark:
        type: config

   

