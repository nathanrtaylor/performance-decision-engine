  category_defaults:
    business:         { base_weight_class: high,   confidence_floor: 0.6 }
    tool_usage:       { base_weight_class: medium, confidence_floor: 0.5 }
    quality_behavior: { base_weight_class: low,    confidence_floor: 0.7 }

  governance:
    disallow_unknown_metrics: true
    disallow_prioritization_if_not_flagged: true
    require_direction: true
    require_category: true
    require_unit: true
    require_source: true
    require_source_metric_key: true
