# Benchmarks (reference/target values) per metric.
#
# Resolution order in scoring (see signals/benchmarks.get_benchmark_value):
#   by_icp_client[cohort]  ->  by_call_type[call_type]  ->  default
# icp_client matching is CASE-INSENSITIVE (source data uses 'MOB-AT&T', the agents table
# 'mob-at&t'); keys here are lowercase. Values must be on the metric's own scale/unit.
#
# Cohorts differ materially on operational metrics (e.g. CRT median ~930s in ATT Mobility vs
# ~1700s in Verizon Soluto), so those carry per-cohort benchmarks anchored at each cohort's
# median of the latest snapshot ("meet the typical performer in your cohort"). Metrics whose
# cohort medians are degenerate (at a scale boundary or a floor) or show no cohort variation are
# kept as single absolute defaults and noted. A benchmark sitting at a distribution extreme is
# flagged at runtime by scoring/assemble._warn_benchmark_outliers.

benchmarks:

  # ---- operational metrics: cohort-specific (per-cohort medians) ----
  transfer_rate:
    default: 0.105
    by_icp_client:
      mob-at&t: 0.10
      mob-verizon: 0.06876
      pss-at&t: 0.094
      "pss-at&t nac": 0.182 
      pss-verizon: 0.133
  crt:
    default: 1410       # seconds
    by_icp_client:
      mob-at&t: 930
      mob-verizon: 980
      pss-at&t: 1250
      "pss-at&t nac": 997
      pss-verizon: 1700
      mcafee: 2444
      xbox: 1850
  talk_time:
    default: 1150       # seconds
    by_icp_client:
      mob-at&t: 830
      mob-verizon: 890
      pss-at&t: 1020
      "pss-at&t nac": 863
      pss-verizon: 1360
      mcafee: 2163
      xbox: 1645
  hold_time:
    default: 80         # seconds
    by_icp_client:
      mob-at&t: 80
      mob-verizon: 61.8
      pss-at&t: 60
      "pss-at&t nac": 43
      pss-verizon: 100
      mcafee: 9.949
      xbox: 33.86
  callback_rate:
    default: 0.265
    by_icp_client:      # only PSS cohorts have sufficient callback data
      pss-at&t: 0.216
      pss-verizon: 0.286
      mcafee: 0.174
      xbox: 0.335
  one_call_resolution:
    default: 0.818
    by_icp_client:
      mob-at&t: 0.76
      mob-verizon: 0.795
      pss-at&t: 0.844
      "pss-at&t nac": 0.83
      pss-verizon: 0.828
      mcafee: 0.949
      xbox: 0.833
  resolution_rate:
    default: 0.857
    by_icp_client:      # MOB cohorts lack sufficient resolution-rate data -> default
      pss-at&t: 0.808
      pss-verizon: 0.875

  # ---- sales: cohort-aware where a real distribution exists ----
  nsp100:
    default: 0.02914       # net sales PER CALL. PSS median is 0 (floor) -> absolute stretch target.
    by_icp_client:      # MOB cohorts have a real sales distribution -> cohort medians.
      mob-at&t: 0.02733
      mob-verizon: 0.02938
      mcafee: 0.072
      pss-at&t: 0.01473
      pss-verizon: 0.03381
  sp100:
    default: 0.08008       # gross sales PER CALL. PSS median is 0 (floor) -> absolute stretch target.
    by_icp_client:      # MOB cohorts have a real sales distribution -> cohort medians.
      mob-at&t: 0.0656
      mob-verizon: 0.09402
      pss-verizon: 0.07698
      pss-at&t: 0.08846
      "pss-at&t nac": 0.022
      mcafee: 0.11   

  # ---- absolute defaults: cohort medians degenerate (scale boundary/floor) or no cohort variation ----
  cancel_rate:
    # POOLED windowing (metric_catalog.cancel_rate.window_aggregation: pooled): the windowed level
    # is Sum(cancels)/Sum(sales) over the window. Benchmarks = per-cohort MEDIAN of the pooled
    # windowed rate (recalc recipe: operational). Cohorts at the overall median (pss-at&t /
    # pss-verizon 0.333) and thin/absent cohorts (pss-at&t nac n=1, xbox) fall to default. Confirm
    # via `recalculate-benchmarks`.
    default: 0.333
    by_icp_client:
      mcafee: 0.207
      mob-at&t: 0.286
      mob-verizon: 0.289
  erp:
    default: 90         # 0-100 scale; cohort median is 100 (ceiling) -> absolute sub-max target.
  nps:
    default: 90  
  expert_5star:
    default: 4.5        # 1-5 scale; uniform across cohorts at 5.0 (ceiling) -> absolute sub-max target.

  # ---- quality behaviors (AI-scored pass-RATES, value = calc 0-1): bottom-quartile floor ----
  # Anchored at each behavior's p25 of the WINDOWED-mean pass-rate (the grain the engine scores on),
  # capped at a 0.95 floor for near-universal behaviors (flag only clear misses). No cohort split
  # (behavior_scores has no icp_client). Three conditional/low-opportunity behaviors
  # (enroll_with_consent, provide_self_service_options, read_t_and_c_s) remain benchmark.type:
  # distribution pending opportunity-gating.
  demonstrate_professionalism_and_courtesy:
    default: 0.95
  act_as_representative_of_our_brand:
    default: 0.728
  appropriate_product_positioning_language:
    default: 0.95
  build_confidence_through_language:
    default: 0.728
  clarify_product_misunderstanding:
    default: 0.204
  actively_listen:
    default: 0.929
  positive_and_helpful_tone:
    default: 0.95
  confirm_caller_and_account_information:
    default: 0.941
  manage_call_efficiently:
    default: 0.9
  ask_effective_questions:
    default: 0.862
  protect_customer_information:
    default: 0.918
  transition_statement:
    default: 0.117
  show_compassion:
    # p25 of per-agent windowed-mean pass-rate (bottom-quartile floor). Cohort splits only where
    # p25 differs materially from the global (|delta| >= 0.05); pss-at&t nac is a clear low outlier.
    # mcafee/mob-verizon/pss-at&t/pss-verizon are within ~0.02 of default and fall through.
    default: 0.286
    by_icp_client:
      mob-at&t: 0.371
      pss-at&t nac: 0.146
      xbox: 0.353
  complete_product_scope_expectations:
    default: 0.108
  provide_assurance:
    default: 0.411
  make_an_offer:
    default: 0.313
  test_resolution:
    default: 0.09
  consistent_closing:
    default: 0.196
  tailor_products_based_on_customer_responses:
    default: 0.07
  recap_resolution:
    default: 0.117

  # ---- Advanced Discovery Call Flow V1 behaviors (Verizon proactive-sell scorecard) ----
  # AI-scored PASS-RATES (value = calc, 0-1; higher = better). Seeded defaults are each behavior's p25
  # of the agent-week pass-rate from the 2026-08-27 extract (bottom-quartile floor, same convention as
  # the quality behaviors above). Re-run `recalculate-benchmarks` once a few weeks accumulate to firm up.
  ask_for_the_sale:
    default: 0.044
  ask_to_send_link_to_enroll:
    default: 0.005
  assess_the_account:
    default: 0.006
  celebrate_enrollment:
    default: 0.01
  core_benefits:
    default: 0.012
  discovery_questions:
    default: 0.133
  greeting:
    default: 0.8
  price:
    default: 0.139
  provide_empathy:
    default: 0.504
  provide_reassurance:
    default: 0.76
  confirm_resolution_ad:
    default: 0.537
  transition_statement_ad:
    default: 0.316

  # ---- sentiment behaviors (Customer Sentiment Scorecard V1 / HEROES Auto QA - VZW) ----
  # AI-scored PASS-RATES (value = calc = score/opportunity, 0-1; higher = better). Anchored at each
  # behavior's p25 of the WINDOWED-mean pass-rate (bottom-quartile floor), capped at a 0.95 floor for
  # near-universal behaviors (flag only clear misses) -- same convention as the quality behaviors above.
  # SCOPE: this scorecard runs on VERIZON cohorts ONLY, so by_icp_client covers mob-verizon / pss-verizon;
  # the AT&T cohorts produce no sentiment rows and fall through to `default`. Cohort split is applied only
  # where mob-verizon vs pss-verizon p25 differ materially (|delta| >= 0.05 OR >= 15% relative); the rest
  # carry a single default.
  # All 12 are higher_is_better in metric_catalog (calc = score/opportunity is already a pass-rate, even for
  # the negatively-framed questions, so a higher share = better); these p25 floors match that direction.
  customer_frustration_sentiment:
    default: 0.584
  customer_complaint_relevance_sentiment:
    default: 0.934
    by_icp_client:
      mob-verizon: 0.868
      pss-verizon: 0.931
  expert_recap_resolution_sentiment:
    default: 0.121
    by_icp_client:
      mob-verizon: 0.227
      pss-verizon: 0.104
  customer_retention_risk_sentiment:
    default: 0.704       # raw p25 at ceiling (1.0) -> near-universal floor; no cohort split
  customer_score_positive_sentiment:
    default: 0.226
    by_icp_client:
      mob-verizon: 0.278
      pss-verizon: 0.228
  customer_score_negative_sentiment:
    default: 0.705      # mob 0.704 vs pss 0.739 (delta 0.035) -> below split threshold, single default
  expert_listening_sentiment:
    default: 0.749
    by_icp_client:
      mob-verizon: 0.867
      pss-verizon: 0.705
  customer_complaint_resolution_time_sentiment:
    default: 0.95       # near-universal floor
  customer_complaint_vague_language_sentiment:
    default: 0.795      # mob 0.791 vs pss 0.776 (delta 0.015) -> single default
  expert_lack_of_resolution_confidence_sentiment:
    default: 0.95       # near-universal floor
  customer_escalation_sentiment:
    default: 0.95       # near-universal floor
  customer_repetition_sentiment:
    default: 0.95       # near-universal floor

  # ---- tool-usage metrics: sources currently disabled (no data to cohort-split) ----
  guided_flow_adoption:
    default: 0.65
  expert_assist_usage:
    default: 0.40
  smart_offer_adoption:
    default: 0.30
