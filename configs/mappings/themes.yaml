# ---------------------------------------------------
# Theme tier configuration — definitions AND selection knobs, centralized.
# The selection knobs below previously lived in configs/active.yaml
# (theme_selection); they now live here so ALL theme config is in one file.
# active.yaml only points at this file via mappings.themes.
# ---------------------------------------------------

# Global selection bar for the theme tier (Tier 2). A theme may override
# count_fraction per-theme (see below); score_level_floor and aggregate are global.
theme_selection:
  count_fraction: 0.5      # >= this fraction of a theme's members must be deficient to qualify
  score_level_floor: 0.20  # single low global "deficient" floor (looser than the solo bar)
  aggregate: mean          # mean | sum: how member score_total combine into the theme score

themes:

  # ---------------------------------------------------
  # Coaching THEMES: groups of related metrics that, when several are
  # deficient together, point at a single coaching theme instead of a
  # single behavior. This is a HUMAN-CURATED, SME-owned artifact.
  #
  # A theme is ONLY added here by a human SME. The propose-only
  # discovery tool (src/cde/themes_discovery, `python -m cde.cli.discover_themes`)
  # can SUGGEST candidate themes from population co-movement, but never
  # writes to this file without explicit --apply authorization.
  #
  # Selection semantics (see src/cde/engine/select.py):
  #   * A theme QUALIFIES for an agent when >= theme_selection.count_fraction
  #     of its members are "deficient" (evidence-gated + score_level above the
  #     loose theme_selection.score_level_floor). This is looser than the
  #     solo-coaching bar on purpose: a metric not worth coaching alone can
  #     still count toward a pattern.
  #   * A theme may set its own `count_fraction` (0, 1] to override the global
  #     bar for that theme only — used to make a WIDE, correlated theme require
  #     a broader pattern (e.g. Call Control 3-of-4) without demanding 3-of-3
  #     on the 3-member themes the way a global 0.75 would.
  #   * A theme may set an OPTIONAL `cohorts:` allow-list to restrict it to
  #     specific cohorts. Entries are lowercase `icp_client` labels (or composite
  #     `icp_client::client` labels from cohort_map.yaml), matched EXACTLY against
  #     the derived icp_client — listing a base like "small clients" does NOT pull
  #     in its "small clients::hp" split. OMIT the field (default) => the theme
  #     applies to ALL cohorts, unchanged. Each listed label must be in
  #     active.yaml `icp_clients` (config_lint errors otherwise).
  #   * A theme may set an OPTIONAL `topic:` DISPLAY LABEL (defaults to the theme
  #     name). Two themes may share the same `topic:` to surface under one coaching
  #     label while being COMPUTED SEPARATELY — pair with `cohorts:` for cohort-
  #     specific variants of the same concept (e.g. an "Efficient Experience — ERP"
  #     theme scoped to pss-verizon and an "Efficient Experience — NPS" theme scoped
  #     to the rest, both `topic: "Efficient Experience"`). The theme KEY (the YAML
  #     name) still must be unique; only the displayed topic is shared.
  #   * Among qualifying themes, the highest combined score wins.
  #   * A break-glass single (metric_catalog break_glass flag) can still
  #     override a theme; an ordinary single is the fallback when no theme
  #     qualifies.
  #
  # `members` must be CANONICAL metric names that exist in
  # metric_catalog.metrics.* (same discipline as topic_map.metric_to_topic).
  # `conversation_type` mirrors topic_map.topic_to_conversation_type.
  #
  # Shape mirrors topic_map.yaml: a single `themes:` root (== the mapping name
  # registered in active.yaml) whose keys are the theme names.
  # ---------------------------------------------------

  "Call Control":
    members:
      - talk_time
      - hold_time
      - crt
      - callback_rate
    conversation_type: "Performance Coaching"
    # Four correlated efficiency metrics co-move, so a 2-of-4 (global 0.5) bar
    # trips constantly and lets a marginal pattern crowd out other themes and
    # single behaviors. Require 3-of-4 for this theme specifically. Do NOT raise
    # the GLOBAL count_fraction to 0.75: 0.75*3=2.25 rounds up to 3-of-3 on the
    # 3-member themes (Resolution Effectiveness, Quality Sales) and guts them.
    count_fraction: 0.75

  #"Resolution Effectiveness":
  #  members:
  #    - resolution_rate
  #    - one_call_resolution
  #    - transfer_rate
  #  conversation_type: "Performance Correction"
  #  count_fraction: 0.75

  #"Customer Sentiment":
  #  members:
  #    - customer_frustration_sentiment
  #    - customer_escalation_sentiment
  #    - customer_retention_risk_sentiment
  #    - expert_listening_sentiment
  #  conversation_type: "Quality Coaching"

  "Quality Sales":
    members:
      - sp100
      - cancel_rate
      - transition_statement_ad
    conversation_type: "Performance Coaching"
    # Optional cohort scoping (omit => all cohorts). Example: restrict to Verizon:
    cohorts:
    #  - "mob-verizon"
      - "pss-verizon"
      - "pss-at&t"
      - "mob-at&t"
      - "mob-verizon"

  "Efficient Experience - ERP":
    topic: "Efficient Experience"
    members: 
      - erp
      - crt
    conversation_type: "Performance Coaching"
    count_fraction: 1
    cohorts:
      - "pss-verizon"

  "Efficient Experience - NPS":
    topic: "Efficient Experience"
    members: 
      - nps
      - crt
    conversation_type: "Performance Coaching"
    count_fraction: 1
    cohorts:
      - "pss-at&t"

  "Efficient Experience - talk time":
    topic: "Efficient Experience"
    members: 
      - nps
      - talk_time
    conversation_type: "Performance Coaching"
    count_fraction: 1
    cohorts:
      - "mob-verizon"
      - "mob-at&t"